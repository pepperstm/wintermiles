[package]
name = "wintermiles-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Route, physics, recording, sensor-protocol and terrain logic for WinterMiles. No I/O."

[dependencies]
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
serde_json = "1"

[dev-dependencies]
fitparser = "0.9"
