[package]
name = "wintermiles"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Ride any GPX route on your indoor trainer in a 3D virtual world."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fitparser = "0.9"
wintermiles-core = { path = "../crates/core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
btleplug = "0.11"
rusb = { version = "0.9", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# The native 3D renderer (an alternative to the webview's three.js).
wgpu = "25"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"

# Strava tokens go in the OS keychain where one is reliably available.
# The native renderer's own view, beneath the web page.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSResponder", "NSWindow", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
# Set by the Tauri CLI for release builds: serve the bundled UI instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
